<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeChica Menu</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f4dff0;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* MENU BAR */
    #menu {
      display: flex;
      gap: 6px;
      padding: 8px;
      background: #fff1a8;
      border-top: 3px solid #e3c04b;
      border-bottom: 3px solid #c99f2f;
      overflow-x: auto;
      white-space: nowrap;
    }

    .menu-item {
      background: #ffeb55;
      border: 2px solid #c40000;
      padding: 5px 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.05s ease, background 0.05s ease;
    }

    .menu-item:hover,
    .menu-item.active {
      background: #fff49a;
      transform: translateY(-2px);
    }

    /* ENABLE OVERLAY */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #overlay-box {
      background: #fff;
      padding: 20px 26px;
      border-radius: 10px;
      text-align: center;
      max-width: 320px;
    }

    #overlay button {
      margin-top: 12px;
      padding: 10px 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2d8fef;
      color: #fff;
      font-size: 14px;
    }

    footer {
      padding: 12px;
      font-size: 13px;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- MENU -->
  <nav id="menu"></nav>

  <!-- INFO -->
  <footer>
    Hover the menu items to hear the original sounds.<br>
    Click “Enable sounds” once to unlock audio.
  </footer>

  <!-- AUDIO UNLOCK OVERLAY -->
  <div id="overlay">
    <div id="overlay-box">
      <strong>Enable sounds</strong>
      <p style="font-size:13px;">
        Browsers require a click before playing sound.
      </p>
      <button id="enableBtn">Enable sounds</button>
    </div>
  </div>

<script>
/* ===========================
   MENU DATA (MATCHES FILES)
   =========================== */
const menuData = [
  { label: "начало",       sound: "nachalo.mp3" },
  { label: "писане",       sound: "pisane.mp3" },
  { label: "оцветяване",   sound: "ocvetqvane.mp3" },
  { label: "смятане",      sound: "smqtane.mp3" },
  { label: "приказки",     sound: "prikazki.mp3" },
  { label: "музика",       sound: "muzika.mp3" },
  { label: "игри",         sound: "igri.mp3" },
  { label: "рисунки",      sound: "risunki.mp3" },
  { label: "занимавки",    sound: "zanimavki.mp3" },
  { label: "наука",        sound: "nauka.mp3" },
  { label: "форум",        sound: "forum.mp3" }
];

/* ===========================
   AUDIO ENGINE (LOW LATENCY)
   =========================== */
let audioCtx;
const buffers = {};
let unlocked = false;

async function loadSound(file) {
  const res = await fetch("sounds/" + file);
  const buf = await res.arrayBuffer();
  return audioCtx.decodeAudioData(buf);
}

function playSound(buffer) {
  if (!buffer) return;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(audioCtx.destination);
  src.start(0);
}

/* ===========================
   BUILD MENU
   =========================== */
const menu = document.getElementById("menu");

menuData.forEach(item => {
  const el = document.createElement("div");
  el.className = "menu-item";
  el.textContent = item.label;

  el.addEventListener("mouseenter", () => {
    if (!unlocked) return;
    playSound(buffers[item.sound]);
  });

  el.addEventListener("touchstart", () => {
    if (!unlocked) return;
    el.classList.add("active");
    playSound(buffers[item.sound]);
  }, { passive: true });

  el.addEventListener("touchend", () => {
    el.classList.remove("active");
  });

  menu.appendChild(el);
});

/* ===========================
   ENABLE AUDIO (REQUIRED)
   =========================== */
document.getElementById("enableBtn").addEventListener("click", async () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();

  for (const item of menuData) {
    buffers[item.sound] = await loadSound(item.sound);
  }

  unlocked = true;
  document.getElementById("overlay").style.display = "none";
});
</script>

</body>
</html>
